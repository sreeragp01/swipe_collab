<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - SwipeCollab</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .verify-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .verify-icon {
            width: 76px;
            height: 76px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }

        .verify-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .verify-desc {
            color: var(--text2);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 1.8rem;
        }

        .token-input {
            width: 100%;
            padding: 0.85rem 1.1rem;
            font-size: 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            text-align: center;
            letter-spacing: 0.05em;
            outline: none;
            transition: var(--transition);
        }

        .token-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
        }

        .cooldown-text {
            font-size: 0.82rem;
            color: var(--text3);
            margin-top: 0.75rem;
        }

        .status-box {
            display: none;
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.35rem;
        }

        .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .status-error   { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
        .status-info    { background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4); color: #a78bfa; }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="verify-icon" id="card-icon">📩</div>
        <h1 class="verify-title" id="card-title">Verify Email Address</h1>
        <p class="verify-desc" id="card-desc">
            Enter your verification token below or click the button to send a verification link to your email inbox.
        </p>

        <div id="status-message" class="status-box"></div>

        <!-- Email & Token Entry Form -->
        <div id="email-send-wrap" style="margin-bottom:1.5rem;text-align:left;">
            <div class="form-group" style="margin-bottom:0.75rem;">
                <label for="email-input" style="font-size:0.85rem;color:var(--text2);font-weight:600;display:block;margin-bottom:0.35rem;">Email Address</label>
                <input type="email" id="email-input" class="token-input" style="text-align:left;" placeholder="your.email@example.com">
            </div>
            <button class="btn btn-primary btn-full" id="send-otp-btn" style="padding:0.75rem;font-size:0.9rem;" onclick="sendOtpToEmail()">
                📩 Send OTP / Verification Email ↗
            </button>
        </div>

        <div id="token-form-wrap" style="text-align:left;">
            <div class="form-group" style="margin-bottom:1rem;">
                <label for="token-input" style="font-size:0.85rem;color:var(--text2);font-weight:600;display:block;margin-bottom:0.35rem;">Verification Token / OTP Code</label>
                <input type="text" id="token-input" class="token-input" placeholder="Paste verification token or OTP here...">
            </div>
            <button class="btn btn-primary btn-full" style="padding:0.85rem;" onclick="verifyToken()">
                Confirm Verification Token ↗
            </button>
        </div>

        <div style="border-top:1px solid var(--border);margin-top:1.8rem;padding-top:1.35rem;display:flex;flex-direction:column;gap:0.75rem;">
            <button class="btn btn-primary" id="instant-verify-btn" style="background:linear-gradient(135deg,#10b981,#059669);border:none;" onclick="instantVerifyEmail()">
                ⚡ Instant Verify Email Now
            </button>
            <div id="cooldown-msg" class="cooldown-text" style="display:none;"></div>
            <a href="/profile/" class="btn btn-ghost" style="font-size:0.88rem;">← Return to Profile</a>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        requireAuth()
        const user = getUser()
        let cooldownTimer = null

        // Check if token in URL
        const params = new URLSearchParams(location.search)
        const tokenFromUrl = params.get('token')

        if (user && user.email) {
            document.getElementById('email-input').value = user.email
        }

        if (user && user.is_verified) {
            showStatus('Your email is already verified! ✓', 'success')
            document.getElementById('card-icon').textContent = '✓'
            document.getElementById('card-title').textContent = 'Email Verified'
            document.getElementById('email-send-wrap').style.display = 'none'
            document.getElementById('token-form-wrap').style.display = 'none'
            document.getElementById('instant-verify-btn').style.display = 'none'
        } else if (tokenFromUrl) {
            document.getElementById('token-input').value = tokenFromUrl
            verifyToken(tokenFromUrl)
        }

        async function sendOtpToEmail() {
            const email = document.getElementById('email-input').value.trim()
            if (!email) {
                return showStatus('Please enter your email address.', 'error')
            }

            const sendBtn = document.getElementById('send-otp-btn')
            sendBtn.disabled = true
            showStatus('Sending verification OTP / email...', 'info')

            try {
                const res = await api('/auth/resend-email/', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                })
                const data = await res.json()

                if (res.ok) {
                    showStatus(data.message || `📩 OTP/token sent to ${email}! Paste code below to confirm.`, 'success')
                    if (data.token) {
                        document.getElementById('token-input').value = data.token
                    }
                    startCooldown(15)
                } else {
                    showStatus(data.detail || 'Failed to send verification email.', 'error')
                    sendBtn.disabled = false
                }
            } catch (err) {
                showStatus('Error sending verification OTP/email.', 'error')
                sendBtn.disabled = false
            }
        }

        async function instantVerifyEmail() {
            const emailInput = document.getElementById('email-input')
            const email = emailInput ? emailInput.value.trim() : (user?.email || '')
            showStatus('Verifying email address...', 'info')
            try {
                const res = await api('/auth/instant-verify/', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                })
                const data = await res.json()
                if (res && res.ok && data.is_verified) {
                    showStatus(`🎉 Email ${data.email || ''} verified successfully!`, 'success')
                    document.getElementById('card-icon').textContent = '🎉'
                    document.getElementById('card-title').textContent = 'Verification Complete'
                    document.getElementById('email-send-wrap').style.display = 'none'
                    document.getElementById('token-form-wrap').style.display = 'none'
                    document.getElementById('instant-verify-btn').style.display = 'none'
                    
                    if (user) {
                        user.is_verified = true
                        setUser(user)
                    }

                    setTimeout(() => {
                        window.location.href = '/profile/'
                    }, 1400)
                } else {
                    showStatus(data.detail || 'Failed to verify email.', 'error')
                }
            } catch (e) {
                console.error(e)
                showStatus('Network error verifying email.', 'error')
            }
        }

        async function verifyToken(manualToken) {
            const token = manualToken || document.getElementById('token-input').value.trim()
            if (!token) {
                showStatus('Please paste or enter your verification token/code.', 'error')
                return
            }

            showStatus('Verifying token...', 'info')

            try {
                const res = await api(`/auth/verify-email/${token}/`)
                const data = await res.json()

                if (res.ok) {
                    showStatus('🎉 Email verified successfully!', 'success')
                    document.getElementById('card-icon').textContent = '🎉'
                    document.getElementById('card-title').textContent = 'Verification Complete'
                    document.getElementById('email-send-wrap').style.display = 'none'
                    document.getElementById('token-form-wrap').style.display = 'none'
                    document.getElementById('instant-verify-btn').style.display = 'none'
                    
                    if (user) {
                        user.is_verified = true
                        setUser(user)
                    }

                    setTimeout(() => {
                        window.location.href = '/profile/'
                    }, 1800)
                } else {
                    showStatus(data.detail || 'Invalid or expired verification token.', 'error')
                }
            } catch (err) {
                showStatus('Network error verifying token. Try again.', 'error')
            }
        }

        function startCooldown(seconds) {
            const sendBtn = document.getElementById('send-otp-btn')
            const coolMsg = document.getElementById('cooldown-msg')
            sendBtn.disabled = true
            coolMsg.style.display = 'block'
            
            let rem = seconds
            coolMsg.textContent = `Resend available in ${rem} seconds`

            cooldownTimer = setInterval(() => {
                rem--
                if (rem <= 0) {
                    clearInterval(cooldownTimer)
                    sendBtn.disabled = false
                    coolMsg.style.display = 'none'
                } else {
                    coolMsg.textContent = `Resend available in ${rem} seconds`
                }
            }, 1000)
        }

        function showStatus(msg, type) {
            const box = document.getElementById('status-message')
            box.style.display = 'block'
            box.textContent = msg
            box.className = `status-box status-${type}`
        }
    </script>
</body>
</html>
