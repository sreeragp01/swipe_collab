<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Talent — SwipeCollab Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-family: var(--font-head);
            font-size: 1.85rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }
        .page-header p {
            color: var(--text2);
            font-size: 0.98rem;
        }

        .search-section {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }
        .search-bar {
            display: flex;
            gap: 0.85rem;
        }
        .search-bar input {
            flex: 1;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .talent-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .talent-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08), var(--shadow-glow);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
        }

        .ai-match-badge {
            background: rgba(16, 138, 0, 0.08);
            border: 1px solid rgba(16, 138, 0, 0.25);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card-title {
            font-family: var(--font-head);
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }
        .card-subtitle {
            color: var(--text2);
            font-size: 0.85rem;
            margin-bottom: 0.85rem;
            font-weight: 500;
        }
        .card-desc {
            color: var(--text2);
            font-size: 0.92rem;
            line-height: 1.55;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.1rem;
        }
        .skill-tag {
            background: #f1f5f9;
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.55rem;
            border-radius: var(--radius-sm);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border);
            font-weight: 700;
            color: #0f172a;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.6rem;
        }
        .card-actions .btn {
            flex: 1;
            font-size: 0.85rem;
            padding: 0.5rem 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="nav-logo">Swipe<span style="color:var(--accent)">Collab</span></a>
        <div class="nav-right-actions"></div>
        <div class="nav-links" id="nav-links">
            <a href="/dashboard/" class="nav-link">Home</a>
            <a href="/discover/" class="nav-link">Discover</a>
            <a href="/projects/" class="nav-link">Projects</a>
            <a href="/talent/" class="nav-link active" style="color:var(--accent); font-weight:700;">Find Talent</a>
            <a href="/workspace/" class="nav-link">Workspace</a>
            <a href="/matches/" class="nav-link">Matches</a>
            <a href="/chat/" class="nav-link">Chat</a>
            <a href="/swipe/" class="nav-link">Quick Match</a>
            <a href="/profile/" class="nav-link">Profile</a>
            <button class="btn btn-ghost" style="padding:0.4rem 0.85rem;font-size:0.8rem;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <h1>Talent Marketplace</h1>
            <p>Hire top developers, designers, and tech experts directly for your projects.</p>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search by name, role, or skill (e.g. Flutter, Django, UI/UX)...">
                <button class="btn btn-primary" onclick="loadTalent()">Search</button>
            </div>
        </div>

        <div class="content-grid" id="talent-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text3);">Loading talent marketplace...</div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            loadTalent();
        });

        async function loadTalent() {
            const grid = document.getElementById('talent-grid');
            const searchVal = document.getElementById('search-input').value;
            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text3);">Fetching talent profiles...</div>`;

            let url = `/projects/talent/?`;
            if (searchVal) url += `search=${encodeURIComponent(searchVal)}&`;

            const res = await api(url);
            if (res && res.ok) {
                const talent = await res.json();
                renderTalent(talent);
            } else {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--red);">Failed to load talent.</div>`;
            }
        }

        function renderTalent(talent) {
            const grid = document.getElementById('talent-grid');
            if (talent.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text3);">No talent profiles found.</div>`;
                return;
            }

            grid.innerHTML = talent.map(t => {
                const matchScore = t.ai_match ? t.ai_match.score : 94;
                const skills = t.skills || [];
                return `
                <div class="talent-card">
                    <div>
                        <div class="card-top">
                            <span class="ai-match-badge">⭐ ${matchScore}% Match</span>
                            <span style="color:var(--accent); font-size:0.8rem; font-weight:700;">🟢 Available</span>
                        </div>
                        <h3 class="card-title">${t.name}</h3>
                        <div class="card-subtitle">${t.title || 'Developer / Designer'}</div>
                        <p class="card-desc">${t.bio || 'Experienced freelancer ready for project opportunities.'}</p>
                        
                        <div class="skill-tags">
                            ${skills.map(s => `<span class="skill-tag">${s.name}</span>`).join('')}
                        </div>
                    </div>
                    
                    <div>
                        <div class="card-meta">
                            <span style="color:var(--accent);">${t.hourly_rate ? '₹' + t.hourly_rate + '/hr' : 'Flexible Rate'}</span>
                            <span style="color:var(--text3); font-weight:500; font-size:0.85rem;">${t.experience_years || 2}+ yrs exp</span>
                        </div>
                        <div class="card-actions">
                            <a href="/profile-view/?id=${t.id}" class="btn btn-outline">Profile</a>
                            <button class="btn btn-primary" onclick="showToast('Invitation sent to ${escapeQuotes(t.name)}!')">Invite to Project</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
