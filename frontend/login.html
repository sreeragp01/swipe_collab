<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SwipeCollab Account Access</title>
    <meta name="description" content="Sign in to your SwipeCollab account to view your matches, chat in real-time, and manage collaboration projects.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#090a0f">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .auth-wrap {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .auth-logo {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .auth-logo span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), var(--shadow-glow);
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .auth-sub {
            color: var(--text2);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .auth-footer {
            color: var(--text2);
            font-size: 0.9rem;
            margin-top: 1.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
            <a href="/" class="auth-logo" style="text-decoration:none;margin-bottom:0;">Swipe<span>Collab</span></a>
            <div class="sc-lang-switcher-container"></div>
        </div>
        <div class="auth-card">
            <h1 class="auth-title" data-i18n="dash_welcome">Welcome back</h1>
            <p class="auth-sub" data-i18n="hero_subtitle">Log in to your workspace and start matching</p>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
                <div class="sc-error" id="err-email"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;display:flex;align-items:center;">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right:2.8rem;width:100%;">
                    <button type="button" id="toggle-pw-btn" onclick="togglePasswordVisibility()" style="position:absolute;right:0.75rem;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.1rem;padding:0.2rem;" title="Show/Hide Password">
                        👁️
                    </button>
                </div>
                <div class="sc-error" id="err-password"></div>
            </div>
            <div class="sc-error" id="err-general" style="margin-bottom:1rem;"></div>
            <button class="btn btn-primary btn-full" id="login-btn" onclick="login()">Log in to account ↗</button>
        </div>
        <div class="auth-footer">Don't have an account? <a href="/register/" style="font-weight:600;">Sign up free</a></div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/i18n.js"></script>

    <script>
        if (getToken()) window.location.href = '/dashboard/'

        function togglePasswordVisibility() {
            const pwInput = document.getElementById('password')
            const btn = document.getElementById('toggle-pw-btn')
            if (pwInput.type === 'password') {
                pwInput.type = 'text'
                btn.textContent = '🙈'
            } else {
                pwInput.type = 'password'
                btn.textContent = '👁️'
            }
        }

        async function login() {
            clearErrors()
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            if (!email) return showError('err-email', 'Email is required.')
            if (!password) return showError('err-password', 'Password is required.')

            const btn = document.getElementById('login-btn')
            btn.disabled = true
            btn.textContent = 'Logging in...'

            try {
                const res = await fetch(`${BASE_URL}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                const data = await res.json()
                if (res.ok) {
                    saveTokens(data.access, data.refresh)
                    saveUser({ id: data.id, email: data.email, role: data.role, is_paid: data.is_paid, is_trial_active: data.is_trial_active, trial_ends_at: data.trial_ends_at })
                    if (data.trial_expired) {
                        showToast('Trial expired. Please pay ₹49 to continue.', 'error')
                        setTimeout(() => window.location.href = '/payment/', 2000)
                    } else {
                        window.location.href = '/dashboard/'
                    }
                } else {
                    showError('err-general', data.detail || 'Invalid email or password.')
                    btn.disabled = false
                    btn.textContent = 'Log in to account ↗'
                }
            } catch {
                showError('err-general', 'Cannot connect to server. Make sure Django is running.')
                btn.disabled = false
                btn.textContent = 'Log in to account ↗'
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') login() })
    </script>
</body>
</html>
