services:
  - type: web
    name: swipecollab
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: TESTING_MODE
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: swipecollab-db
          property: connectionString

databases:
  - name: swipecollab-db
    plan: free

