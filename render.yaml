services:
  - type: web
    name: swipecollab
    env: python
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: TESTING_MODE
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: swipecollab-db
          property: connectionString

databases:
  - name: swipecollab-db
    plan: free

